minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - body-parser
  - electron-to-chromium

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  canvas: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  '@types/react': '19.2.14'
  '@types/react-dom': '19.2.3'
  '@tiptap/core': '3.23.1'
  '@tiptap/pm': '3.23.1'
  '@tiptap/react': '3.23.1'
  '@tiptap/starter-kit': '3.23.1'
  '@tiptap/extension-list': '3.23.1'
  '@tiptap/extension-task-item': '3.23.1'
  '@tiptap/extension-task-list': '3.23.1'
  canvas: '3.2.3'
  body-parser: '1.20.6'
  electron-to-chromium: '1.5.422'

