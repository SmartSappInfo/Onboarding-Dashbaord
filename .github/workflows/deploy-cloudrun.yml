# Build the container in CI and deploy it to Cloud Run.
#
# WHY THIS EXISTS
# The identical `pnpm build` completes in ~4.5 minutes on a GitHub runner (4 vCPU / 16 GB)
# and times out after 57m50s on App Hosting's Cloud Build machine (2 vCPU / 8 GB, not
# configurable). The app is not too large to build — that builder is too small, and once it
# swaps the build collapses. Building here removes the constraint rather than negotiating
# with it. See docs/architecture/backoffice-isolation-plan.md.
#
# CAUTION: this deploys to its OWN Cloud Run service, deliberately separate from the
# App Hosting-managed `studio` service. App Hosting owns that one and would fight us for
# it. The domain is only moved once this service is proven.

name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''
  push:
    branches: [staging]

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  PROJECT_ID: studio-9220106300-f74cb
  REGION: us-central1
  REPOSITORY: app-images

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Guard the manual path so an accidental dispatch cannot deploy.
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'

    # ONE image, TWO services. The client app and the control plane run the same build and
    # are separated at runtime by APP_SURFACE — see src/lib/platform/app-surface.ts. Do not
    # split this into two builds: they must be the same artifact, or the surfaces can drift.
    strategy:
      # Deploy the surfaces one at a time: the backoffice leg consumes the image the client
      # leg pushes, so they cannot run in parallel.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          # BOTH surfaces accept public connections at the Cloud Run edge, because both are
          # reached by people in browsers. Locking the control plane at the IAM layer would
          # require every operator to hold a Google identity token, which no browser sends.
          #
          # The control plane is protected in the application instead, by two layers built
          # for it: the session guard (every /backoffice route redirects to /login, and the
          # backoffice role matrix gates each action) and BACKOFFICE_IP_ALLOWLIST, which is
          # empty for now and can be set later without a code change.
          #
          # CAUTION: the --allow-unauthenticated flag is applied on EVERY deploy and
          # overwrites the IAM policy. Changing access by hand does not survive the next
          # rollout — that is exactly how the client surface silently went private and would
          # have 403'd every visitor once its certificate was issued. Change it HERE.
          - surface: client
            service: smartsapp-app
          - surface: backoffice
            service: smartsapp-backoffice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth. Deliberately NOT a service-account JSON key: this repository is
      # public and has already leaked credentials once (see docs/audit/app_audit.md).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Only the client leg builds and pushes; both legs deploy the SAME tag. Building twice
      # would waste ~4 minutes and, worse, could produce two different artifacts.
      - name: Build image
        if: matrix.surface == 'client'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/smartsapp-app:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="https://go.smartsapp.com" \
            -t "$IMAGE" .

      - name: Push image
        if: matrix.surface == 'client'
        run: docker push "$IMAGE"

      # The backoffice leg does not build, so it needs the tag computed here too.
      - name: Resolve image tag
        if: matrix.surface != 'client'
        run: echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/smartsapp-app:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Runtime configuration mirrors the App Hosting service exactly. Secrets are read
      # from Secret Manager at runtime — never baked into the image, never passed as build
      # args, because build args persist in image history.
      #
      # FIREBASE_CONFIG is copied from the App Hosting service. firebase-admin reads it to
      # self-configure on Google infrastructure; without it the Admin SDK falls back to
      # guessing the project and storage bucket.
      #
      # GOOGLE_APPLICATION_CREDENTIALS is deliberately NOT set — App Hosting does not set
      # it either. The Admin SDK uses the runtime service account's ambient credentials.
      # Setting it to a file path (as .env does for local development) makes every
      # server-rendered page 500, because the file does not exist in the image.
      #
      # The ^@^ prefix switches gcloud's list delimiter to @, so the JSON value's commas
      # are not parsed as separate variables.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ matrix.service }}" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --service-account "${{ secrets.GCP_RUNTIME_SA }}" \
            --set-env-vars "^@^APP_SURFACE=${{ matrix.surface }}@PUBLIC_APP_ORIGIN=https://go.smartsapp.com@NEXT_PUBLIC_APP_URL=https://go.smartsapp.com@NEXT_TELEMETRY_DISABLED=1@FIREBASE_CONFIG={\"databaseURL\":\"\",\"projectId\":\"studio-9220106300-f74cb\",\"storageBucket\":\"studio-9220106300-f74cb.firebasestorage.app\"}" \
            --set-secrets "CRON_SECRET=cron-secret:latest,WHATSAPP_ENCRYPTION_KEY=whatsapp-encryption-key:latest,RESEND_WEBHOOK_SECRET=resend-webhook-secret:latest,RESEND_API_KEY=resend-api-key:latest,MNOTIFY_API_KEY=mnotify-api-key:latest,ONESIGNAL_APP_ID=onesignal-app-id:latest,ONESIGNAL_REST_API_KEY=onesignal-rest-api-key:latest,CLOUD_TASKS_SECRET=CLOUD_TASKS_SECRET:latest" \
            --allow-unauthenticated

      # A deploy that returns 200 on a real page is the only result worth reporting.
      #
      # The backoffice surface is private, so this presents an identity token. Against a
      # private service an unauthenticated request returns 403 from Cloud Run's front end
      # before reaching the container, which says nothing about whether the app works. The
      # token is harmless on the public client surface, so the same step covers both.
      - name: Smoke test the new revision
        run: |
          URL=$(gcloud run services describe "${{ matrix.service }}" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "Deployed: $URL"
          # Workload Identity Federation credentials cannot mint an identity token
          # directly ("No identity token can be obtained from the current credentials"),
          # so the deploy service account impersonates ITSELF to produce one. It holds
          # roles/iam.serviceAccountTokenCreator on itself for this.
          #
          # --audiences must be the service URL: Cloud Run validates the token's audience,
          # and a token minted for the wrong audience is rejected with the same 403 as no
          # token at all.
          TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ secrets.GCP_DEPLOY_SA }}" \
            --audiences="$URL" \
            --include-email)

          check() {
            local path="$1" expected="$2"
            local code
            code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $TOKEN" "$URL$path" || echo 000)
            # Progress goes to stderr so it reaches the log; only the code goes to stdout,
            # where the caller captures it. Echoing both to stdout hid every result inside
            # the command substitution and made a failed smoke test impossible to diagnose.
            echo "  GET $path -> $code (want $expected)" >&2
            echo "$code"
          }

          # Check pages that mean something ON THIS SURFACE.
          #
          # On the client surface, / is server-rendered AND touches Firestore, so it proves
          # the runtime service account's ambient credentials resolve — the exact thing that
          # broke locally, and which /login alone would not have caught.
          #
          # On the backoffice surface, / merely redirects to the client origin, so checking
          # it would prove nothing. /backoffice is the surface's own route; unauthenticated
          # it redirects to /login, which is a healthy 307.
          if [ "${{ matrix.surface }}" = "backoffice" ]; then
            a=$(check /backoffice "2xx/3xx" | tail -1)
            b=$(check /login "2xx/3xx" | tail -1)
          else
            a=$(check /login "2xx/3xx" | tail -1)
            b=$(check / "2xx/3xx" | tail -1)
          fi

          fail=0
          for code in "$a" "$b"; do
            case "$code" in 200|301|302|307|308) ;; *) fail=1 ;; esac
          done
          if [ "$fail" -eq 1 ]; then
            echo "unhealthy — the revision is serving errors"
            exit 1
          fi
          echo "healthy"
