# ==============================================================================
# GitHub Actions Workflow - Automated Firebase Rules & Indexes Deployment
# ==============================================================================
# Deploys firestore.rules, firestore.indexes.json AND storage.rules.
#
# WHY STORAGE IS HERE NOW (2026-09-11):
# storage.rules was in the repo but in NO pipeline, and firebase.json carried no
# `storage` target, so it had never been deployed. The live ruleset silently drifted
# until it opened with `match /{allPaths=**} { allow write, read; }` — an
# unconditional grant that left the whole bucket world-readable AND world-writable
# for roughly six months. Nobody caught it because nothing ever diffed the repo
# against production. Rules that are not in CI are rules nobody is watching.
#
# WHY THIS RUNS ON BOTH BRANCHES:
# App code deploys from `staging` (see deploy-cloudrun.yml). Rules used to deploy
# only from `deployment`. That split is what let code and rules drift apart — a
# change could ship to production with the rules it depends on still undeployed.
# Running on both means a push to either branch keeps rules in step with the code.
#
# AUTHENTICATION — keyless, via Workload Identity Federation.
# This deliberately does NOT use FIREBASE_TOKEN. That secret was never set, and the
# previous workflow skipped its deploy step whenever it was empty, so every run went
# green while deploying nothing — which is how both rulesets drifted unnoticed.
# `firebase login:ci` tokens are also a long-lived credential, and this repository is
# public and has leaked credentials before. WIF is what deploy-cloudrun.yml already
# uses successfully, so the provider and service account secrets already exist.
#
# REQUIRED IAM on ${{ secrets.GCP_DEPLOY_SA }} (grant once, then this runs unattended):
#   roles/firebaserules.admin   — publish Firestore + Storage rulesets
#   roles/datastore.indexAdmin  — create Firestore indexes
# If a run fails with PERMISSION_DENIED, the missing role is one of those two.
# ==============================================================================

name: Deploy Firebase Rules & Indexes

on:
  push:
    branches:
      - deployment
      - staging
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      # firebase.json declares WHICH rule files are deployable at all. A change here
      # can silently take a ruleset in or out of the pipeline, so it must retrigger.
      - 'firebase.json'
      - '.github/workflows/deploy-firestore.yml'
  # Manual escape hatch: lets an operator redeploy rules without an empty commit,
  # e.g. after restoring a ruleset by hand in the console.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy-firebase-rules-and-indexes:
    name: Deploy Firestore & Storage Rules + Indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Guard the manual path so an accidental dispatch cannot deploy.
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Keyless auth. Deliberately NOT a service-account JSON key or a
      # `firebase login:ci` token: this repository is public and has already leaked
      # credentials once. Mirrors deploy-cloudrun.yml.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Compile-check before releasing. `deploy` would catch a syntax error too, but
      # this fails in seconds and keeps a broken ruleset from being the thing that
      # discovers the problem.
      #
      # No --token: firebase-tools picks up the Application Default Credentials that
      # the auth step above wrote. If this step ever reports PERMISSION_DENIED, the
      # deploy service account is missing one of the IAM roles listed at the top.
      - name: Validate rules compile
        run: |
          npx -y firebase-tools deploy \
            --only firestore:rules,storage \
            --project studio-9220106300-f74cb \
            --non-interactive \
            --dry-run

      # CAUTION: no --force. firebase-tools only CREATES indexes by default; deleting
      # an index that exists in the project but not in firestore.indexes.json requires
      # confirmation, which --non-interactive declines. Adding --force here would let a
      # bad diff drop live indexes and take production queries down. Delete indexes by
      # hand, deliberately.
      - name: Deploy Firestore rules + indexes and Storage rules
        run: |
          npx -y firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project studio-9220106300-f74cb \
            --non-interactive
